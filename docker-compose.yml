services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: copilot-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-copilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_password}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot_user} -d ${POSTGRES_DB:-copilot_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgvector_data:
    name: copilot_pgvector_data
